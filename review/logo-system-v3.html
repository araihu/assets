<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arai Hû logo system v3 final review</title>
  <style>
    :root { font-family: ui-sans-serif, system-ui, sans-serif; color: #07111f; background: #d9d9d0; }
    * { box-sizing: border-box; }
    body { margin: 0 auto; max-width: 1500px; padding: 36px 30px 64px; }
    header { display: grid; grid-template-columns: 1.1fr .9fr; gap: 48px; align-items: end; margin-bottom: 28px; }
    h1 { margin: 0; font-size: 54px; line-height: .94; letter-spacing: -.05em; }
    header p { margin: 0; color: #34465d; line-height: 1.55; }
    .product { margin-bottom: 16px; border: 1px solid #93a1b1; background: #f3f2e9; }
    .product h2 { margin: 0; padding: 12px 16px; border-bottom: 1px solid #93a1b1; font-size: 17px; }
    .views { display: grid; grid-template-columns: 1fr 1fr 1fr 1.35fr; }
    figure { display: grid; place-items: center; gap: 12px; min-height: 210px; margin: 0; padding: 18px; }
    figure + figure { border-left: 1px solid #93a1b1; }
    figcaption { justify-self: start; width: 100%; color: #526981; font: 700 11px/1 ui-monospace, monospace; text-transform: uppercase; }
    .mark { width: 128px; height: 128px; object-fit: contain; }
    .night { background: #07111f; }
    .night figcaption { color: #a3b0bf; }
    .sizes { display: flex; align-items: center; gap: 24px; }
    .sizes img:nth-child(1) { width: 64px; height: 64px; }
    .sizes img:nth-child(2) { width: 32px; height: 32px; }
    .sizes img:nth-child(3) { width: 16px; height: 16px; }
    .deliverables { align-content: center; }
    .logo { width: 100%; height: 86px; object-fit: contain; object-position: left center; }
    .favicon { width: 48px; height: 48px; justify-self: start; }
    .family { margin-top: 18px; padding: 22px; background: #07111f; color: #f3f2e9; }
    .family h2 { margin: 0 0 18px; font-size: 17px; }
    .family-row { display: flex; justify-content: space-around; gap: 32px; }
    .family-row img { width: 76px; height: 76px; object-fit: contain; filter: grayscale(1) brightness(0) invert(1); }
  </style>
</head>
<body>
  <header><h1>One system.<br>Five useful signs.</h1><p>Selected v3 family. All marks derive from an 8 px constructive grid and one semantic state color. This sheet checks paper, midnight, favicon scale, outlined lockup, and unlabeled silhouette before canonical promotion.</p></header>
  <main id="products"></main>
  <section class="family"><h2>Unlabeled silhouette family</h2><div id="family" class="family-row"></div></section>
  <script>
    const products = [
      ["araihu", "Arai Hû"], ["goshtoso", "Goshtoso"], ["manja", "Manja"], ["paje", "Pajé"], ["xisnove", "Xisnove"],
    ];
    const asset = (id, suffix, className = "") => `<img class="${className}" src="../concepts/v3/${id}-${suffix}.svg" alt="">`;
    document.getElementById("products").innerHTML = products.map(([id, name]) => `
      <section class="product"><h2>${name}</h2><div class="views">
        <figure><figcaption>paper · 128</figcaption>${asset(id, "mark", "mark")}</figure>
        <figure class="night"><figcaption>midnight · reverse</figcaption>${asset(id, "mark-reverse", "mark")}</figure>
        <figure><figcaption>favicon · 64 / 32 / 16</figcaption><div class="sizes">${asset(id, "favicon")}${asset(id, "favicon")}${asset(id, "favicon")}</div></figure>
        <figure class="deliverables"><figcaption>outlined lockup</figcaption>${asset(id, "logo-outlined", "logo")}${asset(id, "favicon", "favicon")}</figure>
      </div></section>`).join("");
    document.getElementById("family").innerHTML = products.map(([id]) => asset(id, "mark")).join("");
  </script>
</body>
</html>
