name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        github.actor == 'dependabot[bot]' &&
        'ubuntu-24.04' ||
        github.event_name == 'pull_request' &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-pr"]') ||
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-trusted"]')
      }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Materialize provider-owned CI input
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: scripts/materialize-dagger-input.sh ci .dagger-inputs/ci.json

      - name: Install exact Dagger CLI on GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.8"

      - name: Require exact Dagger CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(dagger version | awk 'NR == 1 { print $2 }')" = v0.21.8

      - name: Audit locked Dagger runtime dependencies in Core container
        shell: bash
        run: scripts/dagger/preflight-audit.sh

      - name: Run complete CI with Dagger
        shell: bash
        run: dagger call ci --source=. --payload=.dagger-inputs/ci.json
