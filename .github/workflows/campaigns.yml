name: Resolve campaign channels

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: UTC date override in YYYY-MM-DD form
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - manifests/campaigns.yaml
      - manifests/default.yaml

permissions:
  contents: read

concurrency:
  group: assets-channel-deployment
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: [self-hosted, Linux, X64, hostinger-vps-trusted]
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact Dagger CLI
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: "0.21.8"

      - name: Require exact Dagger CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(dagger version | awk 'NR == 1 { print $2 }')" = v0.21.8

      - name: Materialize provider-owned campaign input
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          AHAIRU_OWNER: ${{ vars.AHAIRU_OWNER }}
          AHAIRU_REPOSITORY: ${{ vars.AHAIRU_REPOSITORY }}
          REQUESTED_DATE: ${{ inputs.date || '' }}
        run: scripts/materialize-dagger-input.sh campaign-plan .dagger-inputs/campaign-plan.json

      - name: Mint selected-repository dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AHAIRU_APP_ID }}
          private-key: ${{ secrets.AHAIRU_APP_PRIVATE_KEY }}
          owner: ${{ vars.AHAIRU_OWNER }}
          repositories: ${{ vars.AHAIRU_REPOSITORY }}
          permission-contents: write

      - name: Build and compare campaign candidate with Dagger
        shell: bash
        env:
          ASSETS_GITHUB_TOKEN: ${{ github.token }}
          AHAIRU_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          dagger call campaign-plan --source=. --payload=.dagger-inputs/campaign-plan.json
          --github-token=env://ASSETS_GITHUB_TOKEN --ahairu-token=env://AHAIRU_GITHUB_TOKEN
          export --path="${RUNNER_TEMP}/campaign-plan"

      - name: Expose campaign plan to provider boundary
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          provider_output="${RUNNER_TEMP}/campaign-plan/provider-output"
          test -f "$provider_output"
          changed=''
          digest=''
          line_count=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            line_count=$((line_count + 1))
            case "$line" in
              changed=true|changed=false)
                test -z "$changed"
                changed=${line#changed=}
                ;;
              digest=*)
                test -z "$digest"
                digest=${line#digest=}
                [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
                ;;
              *)
                echo 'invalid Dagger provider output' >&2
                exit 1
                ;;
            esac
          done < "$provider_output"
          test "$line_count" -eq 2
          test -n "$changed" -a -n "$digest"
          printf 'changed=%s\ndigest=%s\n' "$changed" "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload changed immutable channel bundle
        id: changed
        if: steps.plan.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: channel-${{ steps.plan.outputs.digest }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/campaign-plan/bundle
          if-no-files-found: error
          compression-level: 0

      - name: Materialize provider-owned dispatch input
        if: steps.plan.outputs.changed == 'true'
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          AHAIRU_OWNER: ${{ vars.AHAIRU_OWNER }}
          AHAIRU_REPOSITORY: ${{ vars.AHAIRU_REPOSITORY }}
          CHANNEL_ARTIFACT_ID: ${{ steps.changed.outputs.artifact-id }}
          CHANNEL_ARTIFACT_URL: ${{ steps.changed.outputs.artifact-url }}
          CHANNEL_ARTIFACT_SHA256: ${{ steps.changed.outputs.artifact-digest }}
        run: scripts/materialize-dagger-input.sh campaign-dispatch .dagger-inputs/campaign-dispatch.json

      - name: Dispatch changed candidate with Dagger
        if: steps.plan.outputs.changed == 'true'
        shell: bash
        env:
          AHAIRU_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          dagger call campaign-dispatch --source=. --plan="${RUNNER_TEMP}/campaign-plan"
          --payload=.dagger-inputs/campaign-dispatch.json --ahairu-token=env://AHAIRU_GITHUB_TOKEN
