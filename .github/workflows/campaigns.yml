name: Resolve campaign channels

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: UTC date override in YYYY-MM-DD form
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - manifests/campaigns.yaml
      - manifests/default.yaml

permissions:
  contents: read

concurrency:
  group: assets-channel-deployment
  cancel-in-progress: false

env:
  GOPROXY: off
  GOSUMDB: off
  GONOSUMDB: '*'

jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up exact Go toolchain
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false

      - name: Resolve UTC date
        id: date
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_DATE" ]]; then
            resolved=$(REQUESTED_DATE="$REQUESTED_DATE" ruby -rdate -e '
              raw = ENV.fetch("REQUESTED_DATE")
              parsed = Date.iso8601(raw)
              abort "date must use YYYY-MM-DD" unless parsed.iso8601 == raw
              puts raw
            ')
          else
            resolved=$(date -u +%F)
          fi
          echo "date=$resolved" >> "$GITHUB_OUTPUT"

      - name: Materialize promoted release snapshot
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          default_release=$(ruby -ryaml -e 'puts YAML.safe_load(File.read("manifests/default.yaml")).fetch("release")')
          latest_release=$(ruby -rjson -e 'puts JSON.parse(File.read("dist/release.json")).fetch("release")')
          archive_name="araihu-assets-${default_release}.tar.gz"

          if [[ "$default_release" == "$latest_release" ]]; then
            archive_path="dist/releases/$archive_name"
            test -f "$archive_path"
            release_sha256=$(sha256sum "$archive_path" | awk '{print $1}')
          else
            download="${RUNNER_TEMP}/promoted-release"
            extract="${RUNNER_TEMP}/promoted-release-extract"
            mkdir -p "$download" "$extract" "releases/${default_release}"
            gh release download "$default_release" --repo "$GITHUB_REPOSITORY" \
              --pattern "$archive_name" --dir "$download"
            gh release download "$default_release" --repo "$GITHUB_REPOSITORY" \
              --pattern SHA256SUMS --dir "$download"
            release_sha256=$(awk -v name="$archive_name" '$2 == name { print $1 }' "$download/SHA256SUMS")
            test "$(printf '%s' "$release_sha256" | wc -c)" -eq 64
            printf '%s  %s\n' "$release_sha256" "$download/$archive_name" > "$download/archive.sha256"
            sha256sum --check --strict "$download/archive.sha256"
            tar --list --gzip --file "$download/$archive_name" > "$download/archive.members"
            ruby -e '
              File.readlines(ARGV.fetch(0), chomp: true).each do |path|
                components = path.split("/", -1)
                abort "unsafe release archive member: #{path.inspect}" if
                  path.empty? || path.start_with?("/") || path.include?("\\") ||
                  components.include?("") || components.include?(".") || components.include?("..")
              end
            ' "$download/archive.members"
            tar --list --verbose --gzip --file "$download/$archive_name" |
              awk 'substr($1, 1, 1) != "-" { exit 1 }'
            tar --extract --gzip --file "$download/$archive_name" --directory "$extract"
            for contract in release.json catalog.json themes.json campaigns.json; do
              test -f "$extract/$contract"
              test ! -L "$extract/$contract"
            done
            install -m 0644 "$extract/release.json" "releases/${default_release}/release.json"
            install -m 0644 "$extract/catalog.json" "releases/${default_release}/catalog.json"
            install -m 0644 "$extract/themes.json" "releases/${default_release}/themes.json"
            install -m 0644 "$extract/campaigns.json" "releases/${default_release}/campaigns.json"
          fi

          echo "release=$default_release" >> "$GITHUB_OUTPUT"
          echo "release_sha256=$release_sha256" >> "$GITHUB_OUTPUT"
          echo "release_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${default_release}/${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Build deterministic channel bundle
        id: channel
        shell: bash
        env:
          RESOLUTION_DATE: ${{ steps.date.outputs.date }}
        run: |
          set -euo pipefail
          test "$(go version | awk '{print $3}')" = go1.26.5
          go run ./cmd/araihu-assets themes validate
          go run ./cmd/araihu-assets campaigns validate
          bundle="${RUNNER_TEMP}/channel-bundle"
          go run ./cmd/araihu-assets campaigns publish --date "$RESOLUTION_DATE" --output "$bundle"
          bundle_digest=$(scripts/channel-bundle-digest.rb "$bundle")
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "digest=$bundle_digest" >> "$GITHUB_OUTPUT"

      - name: Mint selected-repository dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AHAIRU_APP_ID }}
          private-key: ${{ secrets.AHAIRU_APP_PRIVATE_KEY }}
          owner: ${{ vars.AHAIRU_OWNER }}
          repositories: ${{ vars.AHAIRU_REPOSITORY }}
          permission-contents: write

      - name: Compare current durable accepted state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AHAIRU_OWNER: ${{ vars.AHAIRU_OWNER }}
          AHAIRU_REPOSITORY: ${{ vars.AHAIRU_REPOSITORY }}
          BUNDLE_DIGEST: ${{ steps.channel.outputs.digest }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_WORKFLOW: ${{ github.repository }}/.github/workflows/campaigns.yml
          STATE_REF: automation/araihu-assets-state
          STATE_PATH: .automation/araihu-assets/accepted-channel-v1.json
        run: |
          set -euo pipefail
          headers=(
            --header "Accept: application/vnd.github+json"
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )
          ref_response="${RUNNER_TEMP}/accepted-state-ref.json"
          ref_status=$(curl --silent --show-error --output "$ref_response" --write-out '%{http_code}' \
            "${headers[@]}" \
            "${GITHUB_API_URL}/repos/${AHAIRU_OWNER}/${AHAIRU_REPOSITORY}/git/ref/heads/${STATE_REF}")
          test "$ref_status" = 200 || {
            echo "Dedicated accepted-state ref is unavailable (HTTP $ref_status)" >&2
            exit 1
          }

          state_response="${RUNNER_TEMP}/accepted-state.json"
          state_status=$(curl --silent --show-error --output "$state_response" --write-out '%{http_code}' \
            "${headers[@]}" \
            "${GITHUB_API_URL}/repos/${AHAIRU_OWNER}/${AHAIRU_REPOSITORY}/contents/${STATE_PATH}?ref=${STATE_REF}")
          case "$state_status" in
            200)
              decision=$(scripts/accepted-channel-state.rb "$state_response" "$BUNDLE_DIGEST" \
                "$SOURCE_REPOSITORY" "$SOURCE_WORKFLOW" "$GITHUB_SERVER_URL" "$STATE_PATH")
              changed=$(ruby -rjson -e 'puts JSON.parse(ARGV.fetch(0)).fetch("changed")' "$decision")
              state_sha=$(ruby -rjson -e 'puts JSON.parse(ARGV.fetch(0)).fetch("sha")' "$decision")
              ;;
            404)
              changed=true
              state_sha=
              ;;
            *)
              echo "Accepted-state read failed (HTTP $state_status)" >&2
              exit 1
              ;;
          esac
          if [[ "$changed" == false ]]; then
            echo "Current durable state already accepts bundle: $BUNDLE_DIGEST"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "sha=$state_sha" >> "$GITHUB_OUTPUT"

      - name: Upload changed immutable channel bundle
        id: changed
        if: steps.state.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: channel-${{ steps.channel.outputs.digest }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.channel.outputs.bundle }}
          if-no-files-found: error
          compression-level: 0

      - name: Dispatch Ahairu and update durable accepted state
        if: steps.state.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AHAIRU_OWNER: ${{ vars.AHAIRU_OWNER }}
          AHAIRU_REPOSITORY: ${{ vars.AHAIRU_REPOSITORY }}
          CHANNEL_ARTIFACT_ID: ${{ steps.changed.outputs.artifact-id }}
          CHANNEL_ARTIFACT_URL: ${{ steps.changed.outputs.artifact-url }}
          CHANNEL_ARTIFACT_SHA256: ${{ steps.changed.outputs.artifact-digest }}
          BUNDLE_DIGEST: ${{ steps.channel.outputs.digest }}
          RELEASE: ${{ steps.release.outputs.release }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          RELEASE_SHA256: ${{ steps.release.outputs.release_sha256 }}
          RESOLUTION_DATE: ${{ steps.date.outputs.date }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_WORKFLOW: ${{ github.repository }}/.github/workflows/campaigns.yml
          STATE_REF: automation/araihu-assets-state
          STATE_PATH: .automation/araihu-assets/accepted-channel-v1.json
          STATE_SHA: ${{ steps.state.outputs.sha }}
        run: |
          set -euo pipefail
          payload="${RUNNER_TEMP}/dispatch.json"
          ruby -rjson -e '
            sha256 = /\A[0-9a-f]{64}\z/
            artifact_id = Integer(ENV.fetch("CHANNEL_ARTIFACT_ID"), 10)
            abort "invalid channel artifact ID" unless artifact_id.positive?
            artifact_sha = ENV.fetch("CHANNEL_ARTIFACT_SHA256")
            abort "invalid channel artifact SHA-256" unless artifact_sha.match?(sha256)
            bundle_digest = ENV.fetch("BUNDLE_DIGEST")
            abort "invalid bundle digest" unless bundle_digest.match?(sha256)
            release_sha = ENV.fetch("RELEASE_SHA256")
            abort "invalid release SHA-256" unless release_sha.match?(sha256)
            expected_artifact = %r{\A#{Regexp.escape(ENV.fetch("GITHUB_SERVER_URL"))}/#{Regexp.escape(ENV.fetch("GITHUB_REPOSITORY"))}/actions/runs/[1-9][0-9]*/artifacts/#{artifact_id}\z}
            abort "invalid channel artifact URL" unless ENV.fetch("CHANNEL_ARTIFACT_URL").match?(expected_artifact)
            payload = {
              event_type: "araihu-assets-released",
              client_payload: {
                assets_repository: ENV.fetch("GITHUB_REPOSITORY"),
                assets_revision: ENV.fetch("GITHUB_SHA"),
                release: ENV.fetch("RELEASE"),
                release_url: ENV.fetch("RELEASE_URL"),
                release_sha256: release_sha,
                channel_artifact_id: artifact_id,
                channel_artifact_url: ENV.fetch("CHANNEL_ARTIFACT_URL"),
                channel_artifact_sha256: artifact_sha,
                bundle_digest: bundle_digest,
                resolution_date: ENV.fetch("RESOLUTION_DATE")
              }
            }
            File.write(ARGV.fetch(0), JSON.generate(payload))
          ' "$payload"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${AHAIRU_OWNER}/${AHAIRU_REPOSITORY}/dispatches" \
            --input "$payload"

          state_update="${RUNNER_TEMP}/accepted-state-update.json"
          ruby -rbase64 -rjson -e '
            record = {
              schemaVersion: 1,
              bundleDigest: ENV.fetch("BUNDLE_DIGEST"),
              channelArtifactId: Integer(ENV.fetch("CHANNEL_ARTIFACT_ID"), 10),
              channelArtifactUrl: ENV.fetch("CHANNEL_ARTIFACT_URL"),
              channelArtifactSha256: ENV.fetch("CHANNEL_ARTIFACT_SHA256"),
              sourceRepository: ENV.fetch("SOURCE_REPOSITORY"),
              sourceWorkflow: ENV.fetch("SOURCE_WORKFLOW"),
              sourceRevision: ENV.fetch("GITHUB_SHA"),
              release: ENV.fetch("RELEASE"),
              releaseUrl: ENV.fetch("RELEASE_URL"),
              releaseSha256: ENV.fetch("RELEASE_SHA256"),
              resolutionDate: ENV.fetch("RESOLUTION_DATE")
            }
            content = JSON.pretty_generate(record) + "\n"
            payload = {
              message: "ci: accept Assets channel #{record.fetch(:bundleDigest)}",
              content: Base64.strict_encode64(content),
              branch: ENV.fetch("STATE_REF")
            }
            state_sha = ENV.fetch("STATE_SHA")
            payload[:sha] = state_sha unless state_sha.empty?
            File.write(ARGV.fetch(0), JSON.generate(payload))
          ' "$state_update"
          state_response="${RUNNER_TEMP}/accepted-state-update-response.json"
          state_status=$(curl --silent --show-error --output "$state_response" --write-out '%{http_code}' \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data-binary "@$state_update" \
            "${GITHUB_API_URL}/repos/${AHAIRU_OWNER}/${AHAIRU_REPOSITORY}/contents/${STATE_PATH}")
          [[ "$state_status" == 200 || "$state_status" == 201 ]] || {
            echo "Accepted-state update failed (HTTP $state_status)" >&2
            exit 1
          }
