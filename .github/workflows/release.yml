name: Release assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, Linux, X64, hostinger-vps-trusted]
    permissions:
      contents: write
    outputs:
      release: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Bind triggering tag to exact event commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          event_sha=$(git rev-parse "${GITHUB_SHA}^{commit}")
          test "$(git rev-parse HEAD)" = "$event_sha"
          tag_sha=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")
          test "$tag_sha" = "$event_sha"
          printf 'tag=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Install exact Dagger CLI
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.8"

      - name: Require exact Dagger CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(dagger version | awk 'NR == 1 { print $2 }')" = v0.21.8

      - name: Materialize provider-owned release inputs
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          scripts/materialize-dagger-input.sh release-build .dagger-inputs/release-build.json
          scripts/materialize-dagger-input.sh release-publish .dagger-inputs/release-publish.json

      - name: Preflight fan-out credentials
        id: fanout-credentials
        shell: bash
        env:
          ARAIHU_ASSETS_APP_ID: ${{ secrets.ARAIHU_ASSETS_APP_ID }}
          ARAIHU_ASSETS_APP_PRIVATE_KEY: ${{ secrets.ARAIHU_ASSETS_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$ARAIHU_ASSETS_APP_ID" ]]; then echo 'ARAIHU_ASSETS_APP_ID is required' >&2; exit 1; fi
          if [[ -z "$ARAIHU_ASSETS_APP_PRIVATE_KEY" ]]; then echo 'ARAIHU_ASSETS_APP_PRIVATE_KEY is required' >&2; exit 1; fi

      - name: Build and verify release bundle with Dagger
        shell: bash
        env:
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
          FANOUT_APP_ID: ${{ secrets.ARAIHU_ASSETS_APP_ID }}
          FANOUT_APP_PRIVATE_KEY: ${{ secrets.ARAIHU_ASSETS_APP_PRIVATE_KEY }}
        run: >-
          dagger call release-bundle --source=. --payload=.dagger-inputs/release-build.json
          --github-token=env://RELEASE_GITHUB_TOKEN --fanout-app-id=env://FANOUT_APP_ID
          --fanout-app-private-key=env://FANOUT_APP_PRIVATE_KEY
          export --path="${RUNNER_TEMP}/release-output"

      - name: Create or safely update matching GitHub Release with Dagger
        shell: bash
        env:
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          dagger call release-publish --source=. --release-output="${RUNNER_TEMP}/release-output"
          --payload=.dagger-inputs/release-publish.json --github-token=env://RELEASE_GITHUB_TOKEN

      - name: Publish immutable release-bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ steps.release.outputs.tag }}
          path: ${{ runner.temp }}/release-output/release-bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Publish latest candidate separately
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-candidate-${{ steps.release.outputs.tag }}
          path: ${{ runner.temp }}/release-output/latest-candidate
          if-no-files-found: error
          retention-days: 90

  fanout:
    needs: publish
    uses: ./.github/workflows/release-fanout.yml
    with:
      release: ${{ needs.publish.outputs.release }}
    secrets:
      ARAIHU_ASSETS_APP_ID: ${{ secrets.ARAIHU_ASSETS_APP_ID }}
      ARAIHU_ASSETS_APP_PRIVATE_KEY: ${{ secrets.ARAIHU_ASSETS_APP_PRIVATE_KEY }}
