name: Release consumer fan-out

on:
  workflow_call:
    inputs:
      release:
        required: true
        type: string
    secrets:
      ARAIHU_ASSETS_APP_ID:
        required: true
      ARAIHU_ASSETS_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      release:
        description: Strict SemVer Assets release tag to retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-consumer-fanout-${{ inputs.release }}
  cancel-in-progress: false

env:
  _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-image://registry.dagger.io/engine:v0.21.11@sha256:6b557cc8b5fdfee0e2e8c82d451ac922097a1255482143e1b96c0be3ff2a303c

jobs:
  dispatch:
    runs-on: [self-hosted, Linux, X64, hostinger-vps-trusted]
    permissions:
      contents: read
    steps:
      - name: Check out fan-out contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install exact Dagger CLI
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.11"

      - name: Verify immutable release handoff with Dagger
        env:
          RELEASE: ${{ inputs.release }}
          RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          dagger call release-fanout-plan --source=. --release="$RELEASE" --run-nonce="$RUN_NONCE"
          --github-token=env://RELEASE_GITHUB_TOKEN export --path="${RUNNER_TEMP}/fanout-plan"

      - name: Expose verified consumer selection
        id: consumers
        run: >-
          "${RUNNER_TEMP}/fanout-plan/releasefanout" outputs
          --manifest="${RUNNER_TEMP}/fanout-plan/release-consumers.yaml"
          --plan="${RUNNER_TEMP}/fanout-plan" --github-output="$GITHUB_OUTPUT"

      - name: Mint selected-repository GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ARAIHU_ASSETS_APP_ID }}
          private-key: ${{ secrets.ARAIHU_ASSETS_APP_PRIVATE_KEY }}
          owner: araihu
          repositories: ${{ steps.consumers.outputs.repositories }}
          permission-contents: write

      - name: Dispatch enrolled fallback consumers with Dagger
        env:
          RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
          CONSUMER_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          dagger call release-fanout --source=. --plan="${RUNNER_TEMP}/fanout-plan"
          --run-nonce="$RUN_NONCE" --consumer-token=env://CONSUMER_GITHUB_TOKEN
