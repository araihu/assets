name: Release consumer fan-out

on:
  workflow_call:
    inputs:
      release:
        required: true
        type: string
    secrets:
      ARAIHU_ASSETS_APP_ID:
        required: true
      ARAIHU_ASSETS_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      release:
        description: Strict SemVer Assets release tag to retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-consumer-fanout-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out fan-out contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify immutable GitHub Release handoff
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          ruby -e '
            pattern = /\Av(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?\z/
            abort "release must be a strict SemVer tag" unless ARGV.fetch(0).match?(pattern)
          ' "$RELEASE"

          published="${RUNNER_TEMP}/published-release"
          mkdir -p "$published"
          release_record="${RUNNER_TEMP}/github-release.json"
          gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft > "$release_record"
          ruby -rjson -e '
            document = JSON.parse(File.read(ARGV.fetch(0)))
            abort "GitHub Release tag mismatch" unless document.fetch("tagName") == ARGV.fetch(1)
            abort "GitHub Release is still a draft" if document.fetch("isDraft")
          ' "$release_record" "$RELEASE"

          archive_name="araihu-assets-${RELEASE}.tar.gz"
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive_name" --pattern release.json --pattern SHA256SUMS \
            --dir "$published"

          assets_revision=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE}" --jq .sha)
          metadata="${RUNNER_TEMP}/release-dispatch.json"
          selected_checks="${RUNNER_TEMP}/release-dispatch.sha256"
          ruby -rjson - "$published" "$archive_name" "$RELEASE" "$assets_revision" "$metadata" "$selected_checks" <<'RUBY'
          root, archive_name, release, revision, metadata_path, checks_path = ARGV
          abort "assets repository mismatch" unless ENV.fetch("GITHUB_REPOSITORY") == "araihu/assets"
          abort "assets revision is not a commit SHA" unless revision.match?(/\A[0-9a-f]{40}\z/)
          lines = File.readlines(File.join(root, "SHA256SUMS"), chomp: true)
          entries = lines.to_h do |line|
            match = line.match(/\A([0-9a-f]{64})  ([^\x00-\x1f\x7f]+)\z/) or abort "invalid SHA256SUMS record"
            [match[2], match[1]]
          end
          abort "duplicate SHA256SUMS record" unless entries.length == lines.length
          required = [archive_name, "release.json"]
          abort "missing dispatch checksum" unless required.all? { |name| entries.key?(name) }
          release_document = JSON.parse(File.read(File.join(root, "release.json")))
          abort "release.json tag mismatch" unless release_document.fetch("release") == release
          File.write(checks_path, required.map { |name| "#{entries.fetch(name)}  #{File.join(root, name)}\n" }.join)
          release_url = "https://github.com/araihu/assets/releases/download/#{release}/#{archive_name}"
          File.write(metadata_path, JSON.generate({
            assets_repository: "araihu/assets",
            assets_revision: revision,
            release: release,
            release_url: release_url,
            release_sha256: entries.fetch(archive_name),
            release_json_sha256: entries.fetch("release.json")
          }))
          RUBY
          sha256sum --check --strict "$selected_checks"
          echo "metadata=$metadata" >> "$GITHUB_OUTPUT"

      - name: Resolve selected consumer repositories
        id: consumers
        shell: bash
        run: |
          set -euo pipefail
          repositories=$(scripts/release-consumer-fanout.rb repositories manifests/release-consumers.yaml)
          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"

      - name: Mint selected-repository GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ARAIHU_ASSETS_APP_ID }}
          private-key: ${{ secrets.ARAIHU_ASSETS_APP_PRIVATE_KEY }}
          owner: araihu
          repositories: ${{ steps.consumers.outputs.repositories }}
          permission-contents: write

      - name: Dispatch enrolled fallback consumers
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: scripts/release-consumer-fanout.rb dispatch manifests/release-consumers.yaml "${{ steps.release.outputs.metadata }}"
