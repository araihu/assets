name: Release consumer fan-out

on:
  workflow_call:
    inputs:
      release:
        required: true
        type: string
    secrets:
      ARAIHU_ASSETS_APP_ID:
        required: true
      ARAIHU_ASSETS_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      release:
        description: Strict SemVer Assets release tag to retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-consumer-fanout-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: [self-hosted, Linux, X64, hostinger-vps-trusted]
    permissions:
      contents: read
    steps:
      - name: Check out fan-out contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install exact Dagger CLI
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: "0.21.8"

      - name: Require exact Dagger CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(dagger version | awk 'NR == 1 { print $2 }')" = v0.21.8

      - name: Materialize provider-owned fan-out inputs
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          scripts/materialize-dagger-input.sh fanout-plan .dagger-inputs/fanout-plan.json
          scripts/materialize-dagger-input.sh fanout-dispatch .dagger-inputs/fanout-dispatch.json

      - name: Verify immutable release handoff with Dagger
        shell: bash
        env:
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          dagger call release-fanout-plan --source=. --payload=.dagger-inputs/fanout-plan.json
          --github-token=env://RELEASE_GITHUB_TOKEN export --path="${RUNNER_TEMP}/fanout-plan"

      - name: Expose verified consumer selection
        id: consumers
        shell: bash
        run: echo "repositories=$(cat "${RUNNER_TEMP}/fanout-plan/repositories")" >> "$GITHUB_OUTPUT"

      - name: Mint selected-repository GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ARAIHU_ASSETS_APP_ID }}
          private-key: ${{ secrets.ARAIHU_ASSETS_APP_PRIVATE_KEY }}
          owner: araihu
          repositories: ${{ steps.consumers.outputs.repositories }}
          permission-contents: write

      - name: Dispatch enrolled fallback consumers with Dagger
        shell: bash
        env:
          CONSUMER_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          dagger call release-fanout --source=. --plan="${RUNNER_TEMP}/fanout-plan"
          --payload=.dagger-inputs/fanout-dispatch.json --consumer-token=env://CONSUMER_GITHUB_TOKEN
