name: Acquisition

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquisition:
    runs-on: [self-hosted, Linux, X64, hostinger-vps-trusted]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact Dagger CLI
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: "0.21.8"

      - name: Require exact Dagger CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(dagger version | awk 'NR == 1 { print $2 }')" = v0.21.8

      - name: Materialize provider-owned acquisition input
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: scripts/materialize-dagger-input.sh acquisition .dagger-inputs/acquisition.json

      - name: Synchronize locked static inputs with Dagger
        shell: bash
        run: dagger call acquisition --source=. --payload=.dagger-inputs/acquisition.json
