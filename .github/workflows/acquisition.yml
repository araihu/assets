name: Acquisition

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOPROXY: off
  GOSUMDB: off
  GONOSUMDB: '*'

jobs:
  acquisition:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false

      - name: Restore Muamba acquisition cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/muamba
          key: muamba-${{ runner.os }}-${{ hashFiles('.muamba.yaml', '.muamba.lock.yaml') }}
          restore-keys: |
            muamba-${{ runner.os }}-

      - name: Synchronize locked static inputs
        shell: bash
        run: |
          set -euo pipefail
          go tool muamba sync --strict --cache-dir .cache/muamba
          go tool muamba verify --strict --cache-dir .cache/muamba
          go tool muamba generate-go --strict --check --dir internal/acquisition --output muamba_gen.go
          git diff --exit-code
